<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM-ROX</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="window">
    <!-- SIDEBAR GAUCHE -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>LLM-ROX</h1>
        <button class="btn-icon" title="Ajouter une app">+</button>
      </div>

      <!-- GROUPES -->
      <nav class="groups">
        <div class="group">
          <h3>Work</h3>
          <ul class="apps-list">
            <li class="app active" data-app="claude">
              <span class="icon">🤖</span>
              <span class="label">Claude</span>
              <span class="badge">2</span>
            </li>
            <li class="app" data-app="chatgpt">
              <span class="icon">💬</span>
              <span class="label">ChatGPT</span>
              <span class="badge">0</span>
            </li>
          </ul>
        </div>

        <div class="group">
          <h3>Tools</h3>
          <ul class="apps-list">
            <li class="app" data-app="gemini">
              <span class="icon">✨</span>
              <span class="label">Gemini</span>
              <span class="badge">0</span>
            </li>
            <li class="app" data-app="perplexity">
              <span class="icon">🔍</span>
              <span class="label">Perplexity</span>
              <span class="badge">0</span>
            </li>
          </ul>
        </div>
      </nav>

      <!-- FOOTER -->
      <div class="sidebar-footer">
        <button class="btn-donate">❤️ Donate</button>
      </div>
    </aside>

    <!-- ZONE PRINCIPALE -->
    <main class="main">
      <!-- TOP TABS -->
      <div class="tabs-bar">
        <div class="tabs">
          <button class="tab active" data-app="claude">
            <span class="icon">🤖</span>
            Claude
            <button class="btn-close">×</button>
          </button>
        </div>
        <button class="btn-add-tab">+</button>
      </div>

      <!-- WEBVIEW CONTAINER -->
      <div class="content">
        <webview id="webview-container" src="https://claude.ai"></webview>
      </div>
    </main>

    <!-- RIGHT PANEL (Optional pour plus tard) -->
    <aside class="inspector">
      <div class="inspector-header">Info</div>
    </aside>
  </div>

  <!-- CONTEXT MENU -->
  <div class="context-menu" id="contextMenu">
    <button data-action="rename">Renommer</button>
    <button data-action="favorite">☆ Favoris</button>
    <button data-action="mute">🔇 Mute</button>
    <hr>
    <button data-action="remove">Supprimer</button>
  </div>

  <!-- Scripts: Order matters! -->
  <script src="skill-manager.js"></script>
  <script src="app.js"></script>
</body>
</html>
