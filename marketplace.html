<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM-ROX Skill Marketplace</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 8px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 16px;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 16px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #f0f0f0;
    }

    .btn-primary {
      background: #1976d2;
      color: white;
      border-color: #1976d2;
    }

    .btn-primary:hover {
      background: #1565c0;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
    }

    .tab {
      padding: 12px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 14px;
      color: #666;
      transition: all 0.2s;
    }

    .tab.active {
      color: #1976d2;
      border-bottom-color: #1976d2;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-icon {
      font-size: 32px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
    }

    .card-author {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
    }

    .card-description {
      font-size: 13px;
      color: #555;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #999;
      margin-bottom: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    .card-rating {
      color: #f39c12;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tag {
      background: #f0f0f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: #666;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .card-actions .btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: #1976d2;
    }

    .stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🎯 LLM-ROX Skill Marketplace</h1>
      <p>Discover, share, and install community-built skills</p>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="stat-skills">28</div>
        <div class="stat-label">Available Skills</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-downloads">5.2K</div>
        <div class="stat-label">Total Downloads</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-favorites">847</div>
        <div class="stat-label">Favorites</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-rating">4.7</div>
        <div class="stat-label">Avg Rating</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search skills by name, tag, or description...">
      </div>
      <div class="filters">
        <select id="categoryFilter">
          <option value="">All Categories</option>
          <option value="Productivity">Productivity</option>
          <option value="Design">Design</option>
          <option value="Development">Development</option>
        </select>
        <select id="sortFilter">
          <option value="trending">Trending</option>
          <option value="rating">Top Rated</option>
          <option value="newest">Newest</option>
        </select>
        <button class="btn btn-primary" id="submitBtn">📤 Submit Skill</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="browse">📚 Browse</button>
      <button class="tab" data-tab="trending">🔥 Trending</button>
      <button class="tab" data-tab="favorites">⭐ My Favorites</button>
      <button class="tab" data-tab="submitted">📤 My Submissions</button>
    </div>

    <!-- Grid of Skills -->
    <div class="grid" id="skillsGrid">
      <!-- Populated by JavaScript -->
    </div>
  </div>

  <!-- Submit Modal -->
  <div class="modal" id="submitModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-header">📤 Submit Your Skill</div>

      <div id="submitMessage"></div>

      <form id="submitForm">
        <div class="form-group">
          <label>Skill Name *</label>
          <input type="text" name="name" required placeholder="e.g., Notion">
        </div>

        <div class="form-group">
          <label>GitHub Repository (user/repo) *</label>
          <input type="text" name="github" required placeholder="e.g., john-doe/llm-rox-skill-notion">
        </div>

        <div class="form-group">
          <label>Icon Emoji *</label>
          <input type="text" name="icon" required placeholder="e.g., 📝" maxlength="1">
        </div>

        <div class="form-group">
          <label>Description *</label>
          <textarea name="description" required placeholder="Brief description of what your skill does..."></textarea>
        </div>

        <div class="form-group">
          <label>Tags (comma-separated) *</label>
          <input type="text" name="tags" required placeholder="e.g., productivity, notes, database">
        </div>

        <div class="form-group">
          <label>Category</label>
          <select name="category">
            <option>Productivity</option>
            <option>Design</option>
            <option>Development</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Author Name</label>
          <input type="text" name="author" placeholder="Your name or organization">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">✅ Submit Skill</button>
      </form>
    </div>
  </div>

  <script src="skill-registry.js"></script>
  <script src="marketplace.js"></script>
</body>
</html>
